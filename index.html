ed)", "form": "10-K", "accession": "0000829224-26-000162", "filed": "2026-11-12", "source_url": "https://www.sec.gov/Archives/edgar/data/829224/000082922426000162/sbux-20260927.htm"}, {"metric_zh": "產品與配送成本 占營收比", "metric_en": "Product and distribution costs % of revenue", "fiscal_year": "FY2026", "period_start": "", "period_end": "2026-09-27", "value": 32.27, "unit": "%", "label": "計算 Calculation", "formula": "ProductionAndDistributionCosts / Revenues × 100", "xbrl_concept": "", "scope_zh": "全公司合併", "scope_en": "Company-wide (consolidated)", "form": "10-K", "accession": "0000829224-26-000162", "filed": "2026-11-12", "source_url": "https://www.sec.gov/Archives/edgar/data/829224/000082922426000162/sbux-20260927.htm"}, {"metric_zh": "其他營業費用 占營收比", "metric_en": "Other operating expenses % of revenue", "fiscal_year": "FY2026", "period_start": "", "period_end": "2026-09-27", "value": 1.44, "unit": "%", "label": "計算 Calculation", "formula": "OtherCostAndExpenseOperating / Revenues × 100", "xbrl_concept": "", "scope_zh": "全公司合併", "scope_en": "Company-wide (consolidated)", "form": "10-K", "accession": "0000829224-26-000162", "filed": "2026-11-12", "source_url": "https://www.sec.gov/Archives/edgar/data/829224/000082922426000162/sbux-20260927.htm"}, {"metric_zh": "折舊與攤銷 占營收比", "metric_en": "Depreciation and amortization % of revenue", "fiscal_year": "FY2026", "period_start": "", "period_end": "2026-09-27", "value": 3.91, "unit": "%", "label": "計算 Calculation", "formula": "DepreciationAndAmortization / Revenues × 100", "xbrl_concept": "", "scope_zh": "全公司合併", "scope_en": "Company-wide (consolidated)", "form": "10-K", "accession": "0000829224-26-000162", "filed": "2026-11-12", "source_url": "https://www.sec.gov/Archives/edgar/data/829224/000082922426000162/sbux-20260927.htm"}, {"metric_zh": "管理費用 占營收比", "metric_en": "General and administrative expenses % of revenue", "fiscal_year": "FY2026", "period_start": "", "period_end": "2026-09-27", "value": 6.26, "unit": "%", "label": "計算 Calculation", "formula": "GeneralAndAdministrativeExpense / Revenues × 100", "xbrl_concept": "", "scope_zh": "全公司合併", "scope_en": "Company-wide (consolidated)", "form": "10-K", "accession": "0000829224-26-000162", "filed": "2026-11-12", "source_url": "https://www.sec.gov/Archives/edgar/data/829224/000082922426000162/sbux-20260927.htm"}, {"metric_zh": "重組與減損 占營收比", "metric_en": "Restructuring and impairments % of revenue", "fiscal_year": "FY2026", "period_start": "", "period_end": "2026-09-27", "value": 1.82, "unit": "%", "label": "計算 Calculation", "formula": "RestructuringSettlementAndImpairmentProvisions / Revenues × 100", "xbrl_concept": "", "scope_zh": "全公司合併", "scope_en": "Company-wide (consolidated)", "form": "10-K", "accession": "0000829224-26-000162", "filed": "2026-11-12", "source_url": "https://www.sec.gov/Archives/edgar/data/829224/000082922426000162/sbux-20260927.htm"}, {"metric_zh": "門市營運費用（推算） 占營收比", "metric_en": "Store operating expenses (derived) % of revenue", "fiscal_year": "FY2026", "period_start": "", "period_end": "2026-09-27", "value": 45.34, "unit": "%", "label": "計算 Calculation", "formula": "門市營運費用（推算） / 總營收 × 100 Store operating expenses (derived) / Revenue × 100", "xbrl_concept": "", "scope_zh": "全公司合併", "scope_en": "Company-wide (consolidated)", "form": "10-K", "accession": "0000829224-26-000162", "filed": "2026-11-12", "source_url": "https://www.sec.gov/Archives/edgar/data/829224/000082922426000162/sbux-20260927.htm"}], "checks": [{"fiscal_year": "FY2024", "revenue_minus_opex_minus_operating_income_musd": -301.2, "note": "非零差額通常為權益法投資收益等項目，需由 B/C 對照損益表確認 Non-zero gap is usually income from equity investees; B/C confirm against the income statement"}, {"fiscal_year": "FY2025", "revenue_minus_opex_minus_operating_income_musd": -247.8, "note": "非零差額通常為權益法投資收益等項目，需由 B/C 對照損益表確認 Non-zero gap is usually income from equity investees; B/C confirm against the income statement"}, {"fiscal_year": "FY2026", "revenue_minus_opex_minus_operating_income_musd": -294.8, "note": "非零差額通常為權益法投資收益等項目，需由 B/C 對照損益表確認 Non-zero gap is usually income from equity investees; B/C confirm against the income statement"}]}, "news": [{"item": {"id": "N1", "title": "Starbucks Is Up 16% Since September as Holiday Merch Becomes \"a Cultural Phenomenon\"", "date": "2026-11-20", "source": "Yahoo Finance / TIKR (excerpt provided by D)", "url": "https://finance.yahoo.com/markets/stocks/articles/starbucks-16-since-september-holiday-101059114.html", "market": "US and global (mixed)", "text_file": "news_text/N1.txt", "headline_only": false}, "result": {"summary": {"zh": "星巴克執行長信件表示，2026 年 11 月 5 日的假期新品上市日，是美國自營門市史上單日銷售最高的一天。FY2026 第四季北美營收為 $7.3 billion，北美部門營業利益率為 12.3%。", "en": "Starbucks' CEO letter says the November 5, 2026 holiday launch was the highest U.S. company-operated sales day ever. In Q4 FY2026, North America revenue was $7.3 billion and the North America segment operating margin was 12.3%."}, "steps": {"fact": {"label": "source_fact", "zh": "公司說法（文章引述執行長信件）：11 月 5 日假期新品上市日是美國自營門市史上單日銷售最高，當天假期飲品占飲品銷量超過三分之一。", "en": "Company statement (CEO letter, cited by the article): the November 5 holiday launch was the highest U.S. company-operated sales day ever, and holiday drinks were more than one in three beverages sold that day."}, "relevance": {"label": "source_fact", "zh": "FY2026 第四季北美營收為 $7.3 billion，占全公司當季 $9.1 billion 的大部分；北美部門營業利益率由 Q4 FY2025 的 4.5% 升至 12.3%。", "en": "Q4 FY2026 North America revenue was $7.3 billion of the company's $9.1 billion; the North America segment operating margin rose from 4.5% in Q4 FY2025 to 12.3%."}, "mechanism": {"label": "source_fact", "zh": "FY2026 第四季北美營收成長來自自營門市營收：北美 Q4 同店銷售 +7.9%（客單價 +5.0%、交易量 +2.7%）。文章中的 7.7% 是「美國」同店銷售，不是北美。", "en": "Q4 FY2026 North America growth came from company-operated store revenue: NA Q4 comparable sales +7.9% (ticket +5.0%, transactions +2.7%). The article's 7.7% is U.S. comparable sales, not North America."}, "affected": {"label": "team_interpretation", "zh": "Q4 利益率的大幅上升有一部分來自基期偏低：Q4 FY2025 北美利益率被 $628.7 million 的北美重組成本壓低。是否真正改善，要看全年數字（北美 FY2026 12.0%，FY2025 11.5%）。", "en": "Part of the Q4 margin jump reflects a low base: the Q4 FY2025 North America margin was reduced by $628.7 million of North America restructuring costs. Whether profitability truly improved depends on full-year figures (NA FY2026 12.0% vs FY2025 11.5%)."}, "directions": {"label": "team_interpretation", "zh": "追蹤假期需求是否在上市日之後持續，例如 Q1 FY2027 北美同店銷售。作者說「主要靠客單價」，但用的是全球數字（全球交易量 +1.8%）；北美 Q4 客單價和交易量都有成長。", "en": "Track whether holiday demand lasts beyond the launch day, e.g. Q1 FY2027 NA comparable sales. The author says 'ticket did most of the work' using global figures (global transactions +1.8%); in North America both ticket and transactions grew in Q4."}}, "bmc_blocks": [{"block": "revenue_streams", "reason": {"zh": "北美 Q4 成長來自自營門市營收：同店銷售 +7.9%（客單價 +5.0%、交易量 +2.7%）。", "en": "NA Q4 growth came from company-operated store revenue: comparable sales +7.9% (ticket +5.0%, transactions +2.7%)."}}], "bmc_indicator": {"color": "green", "reason": {"zh": "銷售動能的更新，不是結構性改變。", "en": "An update on sales momentum, not a structural change."}}, "evidence_status": "sufficient"}, "status": "reviewed", "reasons": [], "open_items": [], "changes": [{"zh": "「美國」同店銷售 7.7% 被 AI 說成北美 → 改為北美 Q4 +7.9%", "en": "AI called the U.S. 7.7% 'North America' → corrected to NA Q4 +7.9%"}, {"zh": "刪除「股價上漲是節日商品帶動」：原文沒有證明因果", "en": "Removed 'stock up 16%, driven by holiday merchandise': no proof of causation"}, {"zh": "刪除「營收 6.2% 與同店銷售 7.7% 相呼應，顯示效率提升」：兩者是不同指標，也不能證明效率", "en": "Removed '6.2% revenue aligns with 7.7% comps, showing efficiency': different measures, and neither shows efficiency"}, {"zh": "利益率上升加上基期說明（Q4 FY2025 北美重組成本 $628.7 million）", "en": "Added the low-base context for the margin rise (Q4 FY2025 NA restructuring $628.7 million)"}, {"zh": "刪除「價值主張」連結；KPI 改用北美數字；燈號黃 → 綠", "en": "Removed the Value Propositions link; KPIs now use NA figures; indicator yellow → green"}], "basis": {"zh": "依 D 提供的文章摘錄", "en": "Based on an excerpt provided by D"}, "source_id": "S9"}, {"item": {"id": "N2", "title": "Starbucks Reports Q4 and Full Fiscal Year 2026 Results", "date": "2026-10-29", "source": "Starbucks press release, Form 8-K Exhibit 99.1, SEC EDGAR", "url": "https://www.sec.gov/Archives/edgar/data/829224/000082922426000154/sbux-09272026xearningsrele.htm", "market": "Global, with North America segment", "text_file": "news_text/N2.txt", "headline_only": false}, "result": {"summary": {"zh": "FY2026 北美部門營收 $28,897.8 million（+5.6%），全年營業利益率 12.0%（FY2025 為 11.5%）。公司表示成長來自其「Back to Starbucks」計畫（公司說法）。", "en": "FY2026 North America revenue was $28,897.8 million (+5.6%), with a full-year operating margin of 12.0% (FY2025: 11.5%). The company attributes the growth to its 'Back to Starbucks' plan (company statement)."}, "steps": {"fact": {"label": "source_fact", "zh": "FY2026 第四季北美營收 $7,328.4 million（Q4 FY2025 為 $6,901.5 million，+6%）；FY2026 第四季北美同店銷售 +7.9%（客單價 +5.0%、交易量 +2.7%）。", "en": "Q4 FY2026 North America revenue was $7,328.4 million (Q4 FY2025: $6,901.5 million, +6%); Q4 FY2026 NA comparable sales +7.9% (ticket +5.0%, transactions +2.7%)."}, "relevance": {"label": "source_fact", "zh": "自營門市約占北美營收 91%（FY2026 全年 91.2%，FY2025 90.6%），所以北美表現主要由自營門市決定。", "en": "Company-operated coffeehouses are about 91% of North America revenue (full-year FY2026 91.2%, FY2025 90.6%), so NA results are driven mainly by company-operated stores."}, "mechanism": {"label": "source_fact", "zh": "公司在 2026 年 9 月關閉約 250 家北美自營門市；FY2026 第四季北美利益率 12.3%（Q4 FY2025 為 4.5%），公司說明主要來自重組成本降低與銷售槓桿。", "en": "In September 2026 the company closed about 250 North America company-operated coffeehouses; the Q4 FY2026 NA margin was 12.3% (Q4 FY2025: 4.5%), which the company attributes mainly to lower restructuring costs and sales leverage."}, "affected": {"label": "source_fact", "zh": "北美全年重組與減損由 FY2025 的 $653.2 million 降至 FY2026 的 $489.8 million。", "en": "North America full-year restructuring and impairments fell from $653.2 million in FY2025 to $489.8 million in FY2026."}, "directions": {"label": "team_interpretation", "zh": "評估北美全年利益率（12.0%）能否持續回升，接近 FY2024 的 19.8%；以及關店對門市數的影響（北美自營門市 11,018 → 10,902 家）。", "en": "Evaluate whether the NA full-year margin (12.0%) keeps recovering toward FY2024's 19.8%, and how closures affect the store base (NA company-operated stores 11,018 → 10,902)."}}, "bmc_blocks": [{"block": "revenue_streams", "reason": {"zh": "北美收入以自營門市為主（約 91%）。", "en": "NA revenue comes mainly from company-operated stores (about 91%)."}}, {"block": "cost_structure", "reason": {"zh": "北美重組與減損：FY2025 $653.2 million → FY2026 $489.8 million。", "en": "NA restructuring and impairments: FY2025 $653.2 million → FY2026 $489.8 million."}}], "bmc_indicator": {"color": "yellow", "reason": {"zh": "約 250 家北美自營門市關閉與重組成本，屬於特定變化。", "en": "About 250 NA company-operated closures and restructuring costs: a specific change."}}, "evidence_status": "sufficient"}, "status": "reviewed", "reasons": [], "open_items": [], "changes": [{"zh": "「73.284 億美元」改回原文單位 $7,328.4 million", "en": "'73.284 億美元' restored to the source unit, $7,328.4 million"}, {"zh": "營收成長、同店銷售、利益率的句子都加上「Q4 FY2026」", "en": "Added 'Q4 FY2026' to the revenue growth, comps and margin sentences"}, {"zh": "刪除中國／國際授權的內容：不在北美範圍，改為北美自營門市營收占比", "en": "Removed China/International licensing: outside NA scope; replaced with NA company-operated revenue share"}, {"zh": "成本結構改用北美重組成本，不用全公司數字", "en": "Cost structure now uses NA restructuring costs, not consolidated figures"}, {"zh": "「Back to Starbucks 帶動成長」標示為公司說法", "en": "'Growth driven by Back to Starbucks' labeled as a company statement"}], "basis": {"zh": "依 SEC 財報新聞稿全文", "en": "Based on the full SEC earnings release"}, "source_id": "S7"}, {"item": {"id": "N3", "title": "Starbucks Reports Q4 and Full Fiscal Year 2025 Results", "date": "2025-10-29", "source": "Starbucks press release, Form 8-K Exhibit 99.1, SEC EDGAR", "url": "https://www.sec.gov/Archives/edgar/data/829224/000082922425000074/sbux-09282025xexhibit991.htm", "market": "Global, with North America segment", "text_file": "news_text/N3.txt", "headline_only": false}, "result": {"summary": {"zh": "FY2025 北美營收 $27,373.1 million（+1.3%），全年營業利益率由 FY2024 的 19.8% 降至 11.5%。北美全年同店銷售 −2%（交易量 −4%、客單價 +2%）。", "en": "FY2025 North America revenue was $27,373.1 million (+1.3%); the full-year operating margin fell from 19.8% in FY2024 to 11.5%. NA full-year comparable sales −2% (transactions −4%, ticket +2%)."}, "steps": {"fact": {"label": "source_fact", "zh": "FY2025 北美全年同店銷售 −2%，來自交易量 −4%，客單價 +2% 部分抵銷。", "en": "FY2025 NA full-year comparable sales declined 2%, driven by a 4% decline in transactions, partly offset by a 2% increase in ticket."}, "relevance": {"label": "source_fact", "zh": "北美 FY2025 全年重組與減損 $653.2 million（FY2024 沒有這項成本）。", "en": "NA FY2025 full-year restructuring and impairments were $653.2 million (none in FY2024)."}, "mechanism": {"label": "source_fact", "zh": "公司說法：北美 Q4 FY2025 利益率由 18.7% 降至 4.5%，原因包括關店與簡化支援組織的重組成本、固定成本攤提變重（deleverage）、Back to Starbucks 的人力時數投入、通膨。4.5% 是北美部門（自營加授權）數字。", "en": "Company statement: the NA Q4 FY2025 margin fell from 18.7% to 4.5% due to restructuring costs from closures and support-organization simplification, deleverage, labor-hour investments under 'Back to Starbucks', and inflation. The 4.5% is the NA segment (company-operated plus licensed)."}, "affected": {"label": "source_fact", "zh": "FY2025 第四季北美關閉 584 家門市，屬於 Back to Starbucks 重組計畫；北美 Q4 重組與減損 $628.7 million。", "en": "584 NA stores closed in Q4 FY2025 under the 'Back to Starbucks' restructuring plan; NA Q4 restructuring and impairments were $628.7 million."}, "directions": {"label": "team_interpretation", "zh": "FY2025 是改革成本最重的起始年，要和 FY2026 比較才能判斷是否回升。", "en": "FY2025 is the cost-heavy start of the plan; compare it with FY2026 to judge whether profitability is recovering."}}, "bmc_blocks": [{"block": "cost_structure", "reason": {"zh": "北美重組成本 $653.2 million、人力時數投入與通膨推高成本。", "en": "NA restructuring 豆，並向乳製品與植物奶、食品、紙杯與餐具等供應商採購；公司另設有 10 個農民支援中心（全球）。", "en": "North America company-operated stores rely on coffee producers, trading companies and exporters for green coffee, and on suppliers of dairy and plant-based milk, food, and paper and plastic products; the company also runs ten farmer support centers (global).", "label": "source_fact", "label_note": "來源事實 Source fact", "source": "[S_] FY2025 10-K, Item 1, Product Supply, pp.9–10"}, "key_activities": {"zh": "公司自行控管咖啡的採購、烘焙與配送，並透過自營門市銷售咖啡、茶、飲品與餐點。Back to Starbucks 的做法包括 Green Apron 服務、改良 Smart Queue 排隊系統、完成超過 1,700 家北美門市改造（恢復舒適座位與「第三空間」），以及關閉未達標準的北美門市。", "en": "The company controls substantially all coffee purchasing, roasting, and distribution, and sells coffee, tea, beverages, and food through company-operated stores. Back to Starbucks actions include Green Apron Service, refining the Smart Queue system, completing more than 1,700 store uplifts across North America (restoring comfortable seating and the third place), and closing North America coffeehouses that did not meet its criteria.", "label": "source_fact", "label_note": "來源事實 Source fact（公司說法 company statements）", "source": "[S_] FY2025 10-K, Item 1, pp.3, 9; [S_] Q4 FY2026 earnings call, pp.4–5"}, "key_resources": {"zh": "北美自營門市在 FY2025 年底有 11,018 家，FY2026 年底有 10,902 家；FY2026 年底美國約有 214,000 名員工在自營門市工作；Starbucks 商標被公司列為具重大重要性。公司說，美國自營門市已有超過 3,000 名門市教練（皆為內部晉升），近 90% 的北美自營門市已有每日配送。", "en": "North America company-operated stores numbered 11,018 at FY2025 year-end and 10,902 at FY2026 year-end; about 214,000 U.S. employees worked in company-operated stores at FY2026 year-end (Sept 27, 2026); the Starbucks trademarks are described as of material importance. The company says U.S. company-operated stores now have more than 3,000 coffeehouse coaches (all promoted from within) and that daily delivery reaches close to 90% of North America company-operated coffeehouses.", "label": "source_fact", "label_note": "來源事實 Source fact（公司說法 company statements）", "source": "[S_] FY2025 10-K, Item 1, pp.5, 8, 11; [S_] FY2026 earnings release, store data table; [S_] Q4 FY2026 earnings call, p.4"}, "value_propositions": {"zh": "公司自述，「星巴克體驗」建立在 Green Apron 服務模式、便利性、順暢的數位體驗，以及反映社區特色的溫暖歡迎門市上。執行長在電話會議中把品牌承諾描述為出色的咖啡、人與人的連結，以及在真正的第三空間裡的顧客體驗。", "en": "By the company's own description, the Starbucks Experience is built on the Green Apron Service Model, convenience, a seamless digital experience, and warm, welcoming stores that reflect their communities. On the call, the CEO described the brand promise as exceptional coffee, human connection, and a great customer experience in a true third place.", "label": "source_fact", "label_note": "來源事實 Source fact（公司自述 company's own description）", "source": "[S_] FY2025 10-K, Item 1, p.7; [S_] Q4 FY2026 earnings call, p.4"}, "customer_relationships": {"zh": "在美國與加拿大，註冊 Starbucks Card 的顧客會自動加入 Starbucks Rewards 並累積星星。電話會議說，新的 Green、Gold、Reserve 等級讓會員因光顧頻率提高而升級，90 天內活躍會員創紀錄達 3,600 萬（原文未標明地區）。", "en": "In the U.S. and Canada, customers who register a Starbucks Card are automatically enrolled in Starbucks Rewards and earn Stars. On the call, the company said the new Green, Gold, and Reserve tiers see members moving up as their visit frequency rises, and that 90-day active members reached a record 36 million (region not stated).", "label": "source_fact", "label_note": "來源事實 Source fact", "source": "[S_] FY2025 10-K, Item 1, p.8; [S_] Q4 FY2026 earnings call, pp.4, 18"}, "channels": {"zh": "顧客在自營門市購買，部分門市也可透過 Starbucks App 的 Mobile Order and Pay 預先點餐。電話會議說約一半的顧客使用得來速（原文未標明地區）；美國外送營收五年內成長超過三倍，並預計從第二季起把外送整合進 Starbucks App。", "en": "Customers buy in company-operated stores, and at certain locations can order ahead through Mobile Order and Pay in the Starbucks app. On the call, the company said roughly half of its customers use the drive-thru (region not stated), that U.S. delivery revenue more than tripled over five years, and that delivery will be integrated into the app starting in Q2.", "label": "source_fact", "label_note": "來源事實 Source fact", "source": "[S_] FY2025 10-K, Item 1, p.8; [S_] Q4 FY2026 earnings call, pp.6–7"}, "customer_segments": {"zh": "10-K 沒有明確定義顧客區隔。電話會議說，第四季銷售成長橫跨不同收入族群、世代與時段，Rewards 會員是交易與銷售成長的主力，FY2027 的行銷要吸引新顧客與久未光顧的顧客。", "en": "The 10-K does not clearly define customer segments. On the call, the company said Q4 sales growth was broad-based across income levels, generations, and day parts, that Rewards members led transaction and sales growth, and that FY2027 marketing aims to bring in new and lapsed customers.", "label": "source_fact", "label_note": "來源事實 Source fact（僅描述成長涵蓋範圍，不是正式的顧客分群 describes the breadth of growth, not a formal segmentation）", "source": "[S_] FY2025 10-K, Item 1, p.3; [S_] Q4 FY2026 earnings call, pp.4–5, 8"}, "revenue_streams": {"zh": "北美收入以自營門市為主：FY2026 北美營收 $28,897.8 百萬美元（+5.6%），其中自營門市 $26,363.9 百萬美元，占 91.2%，授權門市營收連兩年下降（−6.3%、−1.8%）。第四季北美同店銷售 +7.9%（客單價 +5.0%、交易量 +2.7%）；財務長說關閉門市的銷售轉移約貢獻 200 個基點的同店銷售（第四季，應指美國）。", "en": "North America revenue is mostly company-operated stores: FY2026 North America revenue was $28,897.8 million (+5.6%), of which company-operated stores were $26,363.9 million (91.2%), and licensed-store revenue fell two years in a row (−6.3%, −1.8%). In Q4, North America comparable sales rose 7.9% (ticket +5.0%, transactions +2.7%); the CFO said sales transfer from closed stores added about 200 basis points to comparable sales (Q4, apparently U.S.).", "label": "calculation", "label_note": "計算 Calculation（含來源事實 including source facts）", "source": "[S_] FY2026 earnings release; [S_] FY2026 10-K, Note 17; [S_] Q4 FY2026 earnings call, p.13"}, "cost_structure": {"zh": "北美最大的成本是門市營運費用，占北美營收由 FY2024 的 46.2% 升到 FY2025 的 51.0%、FY2026 的 51.5%；北美營業利益率 19.8% → 11.5% → 12.0%。公司說明 FY2025 第四季利潤率下降與重組成本、人力時數投入、通膨有關，FY2026 第四季回升來自重組成本降低與銷售槓桿。", "en": "The largest North America cost is coffeehouse operating expenses, whose share of North America revenue rose from 46.2% in FY2024 to 51.0% in FY2025 and 51.5% in FY2026; North America ne steps, check outputs, keep records, and leave final review to people."}}, "automation": {"status": "final", "items": [{"step": {"zh": "GitHub Actions 定期觸發", "en": "GitHub Actions scheduled trigger"}, "state": "next"}, {"step": {"zh": "run_all.py 串起流程：抓 SEC 資料並計算 KPI", "en": "run_all.py orchestrates SEC data retrieval and KPI calculation"}, "state": "next"}, {"step": {"zh": "parse_segments.py 自動解析北美部門數字，取代人工登錄", "en": "parse_segments.py automatically parses North America segment figures, replacing manual entry"}, "state": "next"}, {"step": {"zh": "check_10k.py 自動對照 10-K，不符就停止", "en": "check_10k.py compares figures with the 10-K and stops on mismatches"}, "state": "complete"}, {"step": {"zh": "discover_sec_news.py 自動尋找新的 8-K 新聞", "en": "discover_sec_news.py automatically finds new 8-K news"}, "state": "next"}, {"step": {"zh": "Gemini 新聞分析，再由 Python 檢查", "en": "Gemini analyzes news, followed by Python checks"}, "state": "next"}, {"step": {"zh": "組員複核新聞與結論", "en": "Team members review the news and conclusions"}, "state": "human"}, {"step": {"zh": "build_spa.py 產生新一期網頁", "en": "build_spa.py generates the next issue's webpage"}, "state": "complete"}, {"step": {"zh": "發布新一期網頁", "en": "Publish the new issue's webpage"}, "state": "next"}]}, "next_steps": {"status": "final", "items": [{"zh": "每期使用獨立資料夾，例如 periods/2026-W12/，讓各期可比較且不互相覆蓋。", "en": "Use a separate folder for each period, such as periods/2026-W12/, so issues can be compared without overwriting one another."}, {"zh": "累積多期資料後，再評估 RAG（先檢索相關檔案，再讓 AI 回答）。", "en": "After collecting multiple periods, evaluate RAG (retrieve relevant files before asking AI to answer)."}, {"zh": "FY2027 追蹤指標：門市營運費用占比、北美營業利益率。", "en": "FY2027 tracking metrics: coffeehouse operating expenses as a share of revenue and North America operating margin."}]}, "workflow": {"status": "final", "steps": [{"zh": "Python 從 SEC EDGAR 抓取星巴克申報資料（自動）", "en": "Python fetches Starbucks filings from SEC EDGAR (automated)"}, {"zh": "Python 計算營收成長、毛利率、營業利益率與成本占比（自動）", "en": "Python calculates revenue growth, margins and cost ratios (automated)"}, {"zh": "組員從年報登錄北美部門數字並雙人核對（人工）", "en": "Members enter North America segment figures from the 10-K and double-check them (manual)"}, {"zh": "Gemini 對新聞做五步分析，Python 檢查數字與標籤（自動）", "en": "Gemini runs a five-step news analysis; Python checks numbers and labels (automated)"}, {"zh": "組員檢查 AI 解讀並連結到 RS、CS 與 BMC（人工）", "en": "Members review AI interpretations and link them to RS, CS and the BMC (manual)"}]}, "verification": {"status": "final", "items": [{"zh": "第一次產生 KPI 表時，成本科目加總比營業費用合計少約 64.6 億美元：SEC API 沒有「門市營運費用」科目，且誤用了屬於附註細項的人事費用。修正為推算值並標示待核對。", "en": "The first KPI run was about USD 6.46 billion short of total operating expenses: the SEC API has no 'store operating expenses' tag, and a note-level labor expense had been included. Fixed by deriving the line and flagging it for checking."}, {"zh": "AI 新聞分析曾把「$300 million」寫成「3 億美元」、把 operating income 譯成「營業收入」。已加入金額比對檢查與用語對照表。", "en": "The AI analysis converted '$300 million' to 「3 億美元」 and mistranslated operating income. Added an amount-matching check and a terminology glossary."}, {"zh": "KPI 表自動對照 10-K 損益表：54 格中 53 格相符、0 格不符（FY2024 年增率刻意留空）。並確認兩個疑點：推算的門市營運費用等於 10-K 的 Coffeehouse operating expenses；每年 2.5–3 億美元差額正好是權益法投資收益。", "en": "Automatic check of the KPI table against the 10-K income statement: 53 of 54 cells match, 0 mismatch (FY2024 growth is blank on purpose). It also settled two questions: the derived store operating expenses equal the 10-K's coffeehouse operating expenses, and the yearly USD 250–300 million gap is exactly income from equity investees."}, {"zh": "B 獨立抽查（由 AI 工具 Codex 執行）：不使用我們的程式，直接讀 10-K 原文，抽查 6 個數字並重算毛利率，全部一致。北美部門數字由 B 從年報登錄，A 對照 SEC 財報新聞稿，6 個數字全部相符。（C 複查待補）", "en": "B's independent spot-check (run with the AI tool Codex): read the 10-K directly without our script, checked 6 figures and recomputed gross margin; all agree. B entered the North America figures from the 10-K and A checked all 6 against the SEC earnings releases. (C's re-check to be added)"}]}, "rs": {"status": "final", "conclusion": {"zh": "星巴克的收入以自營門市為主（FY2026 占全公司 81.6%、占北美 91.2%），北美部門占全公司營收 76.2%。FY2026 北美營收 +5.6%，主要來自自營門市（+6.3%）；北美授權收入連兩年下降，國際部門因中國業務改為授權合資模式而下降 13.8%。", "en": "Starbucks earns most of its revenue from company-operated stores (81.6% of the total and 91.2% of North America in FY2026), and North America is 76.2% of total revenue. FY2026 North America revenue grew 5.6%, mainly from company-operated stores (+6.3%); NA licensed revenue fell for two years, and International fell 13.8% after China moved to a licensed joint venture model."}, "interpretation": {"zh": "北美自營門市減少 116 家（11,018 → 10,902），營收仍成長，成長來自既有門市的銷售：FY2026 第四季北美同店銷售 +7.9%（客單價 +5.0%、交易量 +2.7%）。（C 的解讀）", "en": "NA company-operated stores fell by 116 (11,018 → 10,902) while revenue still grew, so growth came from existing stores: Q4 FY2026 NA comparable sales +7.9% (ticket +5.0%, transactions +2.7%). (C's interpretation)"}}, "cs": {"status": "final", "conclusion": {"zh": "最大成本是門市營運費用（約占營收 45%）與產品與配送成本（約 32%）。在北美，門市營運費用占北美營收由 FY2024 的 46.2% 升到 FY2025 的 51.0%、FY2026 的 51.5%；重組與減損在 FY2025、FY2026 分別占北美營收 2.4% 與 1.7%。", "en": "The largest costs are coffeehouse operating expenses (about 45% of revenue) and product and distribution costs (about 32%). In North America, coffeehouse operating expenses rose from 46.2% of NA revenue in FY2024 to 51.0% in FY2025 and 51.5% in FY2026; restructuring and impairments were 2.4% and 1.7% of NA revenue in FY2025 and FY2026."}, "interpretation": {"zh": "北美營業利益率 19.8% → 11.5% → 12.0%。公司說明 FY2025 下降與重組成本、人力時數投入、通膨有關，FY2026 回升來自重組成本降低與銷售槓桿。【計算】FY2025 → FY2026，北美重組與減損占比 −0.7 個百分點、一般及行政 −0.5、折舊攤銷與其他營業費用各 −0.2，但產品與配送成本 +0.8、門市營運費用 +0.4：回升來自重組與管理成本下降，門市成本占比仍在上升。", "en": "NA operating margin went 19.8% → 11.5% → 12.0%. The company links the FY2025 drop to restructuring costs, labor-hour investments and inflation, and the FY2026 recovery to lower restructuring costs and sales leverage. [Calculation] From FY2025 to FY2026, NA restructuring fell 0.7 pp of revenue, G&A 0.5 pp, and D&A and other operating expenses 0.2 pp each, while product and distribution rose 0.8 pp and coffeehouse operating expenses 0.4 pp: the recovery came from lower restructuring and overhead, while store costs kept rising."}}, "news_bmc": {"status": "final", "intro": {"zh": "以下新聞由 Agent 先做 AI 分析，再由 D 對照原文逐句複核修正；展開每則下方的清單，可看到組員修正了 AI 哪些地方。「組員解讀」是推論，不是事實；同時發生不代表已證明因果。", "en": "The Agent drafted each analysis with AI; D then checked every sentence against the source and corrected it. Open the list under each item to see what the team corrected. 'Team interpretation' is inference, not fact; co-occurrence does not prove causation."}}, "conclusion": {"status": "final", "meaning": {"zh": "星巴克北美的商業模式靠自營門市賺錢，也承擔門市的全部成本。改革先付出關店與人力成本（FY2025），FY2026 營收回升、重組成本減少，但門市營運費用占比仍在上升。要判斷改革是否成功，需要再觀察 FY2027 門市成本與利益率能否持續改善。", "en": "Starbucks North America earns its money from company-operated stores and carries all their costs. The plan first paid for closures and labor (FY2025); in FY2026 revenue recovered and restructuring costs fell, but store operating costs kept rising as a share of revenue. Judging success requires watching whether store costs and margins keep improving in FY2027."}, "limits": [{"zh": "毛利率為計算值（總營收 − 產品與配送成本）÷ 總營收，非官方揭露。", "en": "Gross margin is calculated: (revenue − product and distribution costs) ÷ revenue; not officially reported."}, {"zh": "門市營運費用為推算值，已確認等於 10-K 的 Coffeehouse operating expenses。", "en": "Store operating expenses are derived; confirmed equal to the 10-K line \"Coffeehouse operating expenses\"."}, {"zh": "FY2024 營收年增率留空，因 FY2023 營收不在 FY2026 年報中。", "en": "FY2024 revenue growth is blank because FY2023 revenue is not in the FY2026 10-K."}, {"zh": "北美部門數字包含自營與授權門市，公司未拆開利潤，不可當成自營門市的利潤。", "en": "North America segment figures include company-operated and licensed stores; the company does not split profit, so they are not company-operated-only results."}, {"zh": "只有一年回升，無法分辨是策略效果，還是重組成本減少的一次性影響。", "en": "With one year of recovery, we cannot separate the plan's effect from a one-off drop in restructuring costs."}], "ai_disclosure": {"zh": "AI 使用揭露：約 65–70%。估算方式：依 13 個工作檔案開頭的「AI 使用」自述，AI 參與程度為「高」（AI 產生主要內容或執行檢查）的有 9 個（約 69%）；這是按檔案數量估算，不是工時或字數比例。整理由 Codex 協助。AI 用於：抓取與計算財報數字的 Agent 程式、新聞分析草稿、抽查、BMC 與 RS/CS 起草；所有數字均對照 SEC 原文，新聞分析經 D 逐句複核。", "en": "AI use disclosure: about 65–70%. Method: based on the \"AI use\" line in 13 working files, 9 have high AI involvement (AI produced the main content or ran the check), about 69%; this counts files, not hours or words. Compiled with help from Codex. AI was used for the Agent code that fetches and calculates figures, news-analysis drafts, the spot-check, and drafting the BMC and RS/CS. All figures were checked against SEC filings, and D reviewed the news analyses sentence by sentence."}}}, "na": [{"metric": "revenue", "period": "FY2026", "value": "28897.8", "unit": "USD millions", "scope": "North America segment", "source_url": "https://www.sec.gov/Archives/edgar/data/829224/000082922426000162/sbux-20260927.htm", "entered_by": "Agent (10-K Note 17)", "checked_by": "self-check; vs B's manual entries"}, {"metric": "operating_income", "period": "FY2026", "value": "3454.2", "unit": "USD millions", "scope": "North America segment", "source_url": "https://www.sec.gov/Archives/edgar/data/829224/000082922426000162/sbux-20260927.htm", "entered_by": "Agent (10-K Note 17)", "checked_by": "self-check; vs B's manual entries"}, {"metric": "revenue", "period": "FY2025", "value": "27373.1", "unit": "USD millions", "scope": "North America segment", "source_url": "https://www.sec.gov/Archives/edgar/data/829224/000082922426000162/sbux-20260927.htm", "entered_by": "Agent (10-K Note 17)", "checked_by": "self-check; vs B's manual entries"}, {"metric": "operating_income", "period": "FY2025", "value": "3156.7", "unit": "USD millions", "scope": "North America segment", "source_url": "https://www.sec.gov/Archives/edgar/data/829224/000082922426000162/sbux-20260927.htm", "entered_by": "Agent (10-K Note 17)", "checked_by": "self-check; vs B's manual entries"}, {"metric": "revenue", "period": "FY2024", "value": "27009.5", "unit": "USD millions", "scope": "North America segment", "source_url": "https://www.sec.gov/Archives/edgar/data/829224/000082922426000162/sbux-20260927.htm", "entered_by": "Agent (10-K Note 17)", "checked_by": "self-check; vs B's manual entries"}, {"metric": "operating_income", "period": "FY2024", "value": "5355.3", "unit": "USD millions", "scope": "North America segment", "source_url": "https://www.sec.gov/Archives/edgar/data/829224/000082922426000162/sbux-20260927.htm", "entered_by": "Agent (10-K Note 17)", "checked_by": "self-check; vs B's manual entries"}], "built_at": "2026-11-24T10:18:28+00:00"}</script>
<script>
const D=JSON.parse(document.getElementById('payload').textContent),T=D.text||{},R=D.rscs||{},P=D.perf||{};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bi=o=>o?`<span class="zh">${esc(o.zh)}</span><span class="en">${esc(o.en)}</span>`:'';
const L=(zh,en)=>`<span class="zh">${esc(zh)}</span><span class="en">${esc(en)}</span>`;
const draft=o=>o&&o.status==='draft'?` <span class="badge draft">${L('草稿','Draft')}</span>`:'';
const years=P.fiscal_years||[], rows=P.rows||[], last=years.length-1;
const get=(metric,year)=>{const r=rows.find(x=>x.metric_en===metric&&x.fiscal_year===year);return r&&r.value!==''?Number(r.value):null};
const pct=v=>v==null||!Number.isFinite(v)?'—':`${v.toFixed(1)}%`;
const money=v=>v==null||!Number.isFinite(v)?'—':v.toLocaleString('en-US',{maximumFractionDigits:1});
const rowBy=(group,name)=>((R[group]||[]).flatMap(t=>t.rows||[])).find(r=>r.en===name);
const groupByTitle=(group,title)=>((R[group]||[])).find(t=>t.title?.en===title);
const totalNA=year=>{const t=groupByTitle('rs','Revenue by segment (% of total)'),r=t?.rows.find(x=>x.en==='North America');return r?.values?.[R.years.indexOf(year)]??null};
const share=(name,group='rs',title='North America revenue by type (% of NA revenue)')=>{const r=rowBy(group,name),i=R.years.length-1,den=totalNA(R.years[i]);return r&&den?Number(r.values[i])/den*100:null};
const source=(ids=[])=>ids.map(id=>`[${esc(id)}]`).join(' ');
const srcLine=(ids=['S1'])=>`<div class="src small">${L('來源','Source')}：${source(ids)}</div>`;
function lineChart(values,labels,opts={}){const W=600,H=300,p={l:56,r:24,t:32,b:44},valid=values.filter(v=>Number.isFinite(v));if(!valid.length)return `<p class="muted">${L('沒有可用的部門數字。','No segment figures available.')}</p>`;const max=Math.ceil(Math.max(...valid)/5)*5,min=Math.floor(Math.min(...valid)/5)*5-5,range=max-min||1,x=i=>p.l+(W-p.l-p.r)*(labels.length===1?.5:i/(labels.length-1)),y=v=>p.t+(H-p.t-p.b)*(1-(v-min)/range);let g='';for(let i=0;i<=4;i++){const v=min+(range*i/4),yy=y(v);g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${p.l-8}" y="${yy+4}" text-anchor="end" font-size="12" fill="var(--muted)">${v.toFixed(0)}%</text>`}g+=`<line x1="${x(Math.max(0,labels.length-2))}" x2="${x(Math.max(0,labels.length-2))}" y1="${p.t}" y2="${H-p.b}" stroke="var(--gold)" stroke-dasharray="5 4"/><text x="${Math.min(W-28,x(Math.max(0,labels.length-2))+5)}" y="${p.t+13}" font-size="11" fill="var(--gold)"><tspan class="zh">${esc(opts.event?.zh||'')}</tspan><tspan class="en">${esc(opts.event?.en||'')}</tspan></text>`;g+=`<polyline points="${values.map((v,i)=>Number.isFinite(v)?`${x(i)},${y(v)}`:'').filter(Boolean).join(' ')}" fill="none" stroke="var(--green)" stroke-width="3"/>`;values.forEach((v,i)=>{if(!Number.isFinite(v))return;g+=`<circle cx="${x(i)}" cy="${y(v)}" r="5" fill="var(--green)"/><text x="${x(i)}" y="${y(v)-11}" text-anchor="middle" font-size="13" fill="var(--ink)">${pct(v)}</text>`});labels.forEach((lab,i)=>g+=`<text x="${x(i)}" y="${H-15}" text-anchor="middle" font-size="12" fill="var(--muted)">${esc(lab)}</text>`);return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'line chart')}">${g}</svg>`}
function barChart(series,opts={}){const W=600,H=300,p={l:55,r:16,t:20,b:42},vals=series.map(x=>x.v).filter(Number.isFinite),max=Math.max(1,...vals)*1.18,bw=(W-p.l-p.r)/Math.max(1,series.length);let g='';for(let i=0;i<=4;i++){const v=max*(1-i/4),y=p.t+(H-p.t-p.b)*i/4;g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${p.l-7}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${money(v)}</text>`}series.forEach((s,i)=>{const h=Number.isFinite(s.v)?(H-p.t-p.b)*s.v/max:0,x=p.l+bw*i+bw*.2,y=H-p.b-h;g+=`<rect x="${x}" y="${y}" width="${bw*.6}" height="${h}" rx="4" fill="var(--green)"/><text x="${x+bw*.3}" y="${y-5}" text-anchor="middle" font-size="11" fill="var(--ink)">${money(s.v)}</text><text x="${x+bw*.3}" y="${H-14}" text-anchor="middle" font-size="12" fill="var(--muted)">${esc(s.label)}</text>`});return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'bar chart')}">${g}</svg>`}
function mixChart(table,title){const ys=R.years||[],seg=groupByTitle('rs','Revenue by segment (% of total)'),total=ys.map(y=>(seg?.rows||[]).reduce((sum,r)=>sum+(Number(r.values[ys.indexOf(y)])||0),0));const parts=(table?.rows||[]).map((r,i)=>({r,color:['var(--green)','var(--gold)','var(--blue)','var(--purple)'][i%4]}));const W=600,H=300,p={l:48,r:10,t:14,b:40},bw=(W-p.l-p.r)/Math.max(1,ys.length);let g='';[0,25,50,75,100].forEach(v=>{const y=p.t+(H-p.t-p.b)*(1-v/100);g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${p.l-7}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}%</text>`});ys.forEach((yr,i)=>{let acc=0;parts.forEach(({r,color})=>{const v=total[i]?Number(r.values[i])/total[i]*100:0,x=p.l+bw*i+bw*.18,y=p.t+(H-p.t-p.b)*(1-(acc+v)/100),h=(H-p.t-p.b)*v/100;g+=`<rect x="${x}" y="${y}" width="${bw*.64}" height="${h}" fill="${color}"><title>${esc(yr)} ${esc(r.en)}: ${pct(v)}</title></rect>`;if(v>7)g+=`<text x="${x+bw*.32}" y="${y+h/2+4}" text-anchor="middle" font-size="10" fill="#fff">${pct(v)}</text>`;acc+=v});g+=`<text x="${p.l+bw*i+bw*.5}" y="${H-14}" text-anchor="middle" font-size="12" fill="var(--muted)">${esc(yr)}</text>`});return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${g}</svg><div class="legend">${parts.map(({r,color})=>`<span><i style="background:${color}"></i>${bi(r)}</span>`).join('')}</div>`}
function waterfall(){
  const costs=(R.cs||[]).flatMap(t=>t.rows||[]),ys=R.years||[],i0=ys.length-2,i1=ys.length-1,rev0=totalNA(ys[i0]),rev1=totalNA(ys[i1]);
  const preferred=['Restructuring & impairments','G&A','D&A','Other operating','Product & distribution','Coffeehouse operating'];
  const items=costs.map(r=>({name:r,delta:((Number(r.values[i1])/rev1)-(Number(r.values[i0])/rev0))*100})).filter(x=>Number.isFinite(x.delta));
  items.sort((a,b)=>preferred.indexOf(a.name.en)-preferred.indexOf(b.name.en));
  const effect=-items.reduce((sum,x)=>sum+x.delta,0),lim=Math.max(.2,...items.map(x=>Math.abs(x.delta)))*1.25,W=700,rowH=44,H=Math.max(230,items.length*rowH+48),p={l:230,r:58,t:14,b:20},x0=p.l+(W-p.l-p.r)/2,scale=(W-p.l-p.r)/2/lim;
  let g=`<line x1="${x0}" x2="${x0}" y1="${p.t}" y2="${H-p.b}" stroke="var(--muted)"/>`;
  items.forEach((a,i)=>{const y=p.t+i*rowH+7,w=Math.abs(a.delta)*scale,x=a.delta<0?x0-w:x0,color=a.delta<0?'var(--green)':'var(--red)';g+=`<text x="${p.l-8}" y="${y+14}" text-anchor="end" font-size="13" fill="var(--ink)"><tspan class="zh">${esc(a.name.zh)}</tspan><tspan class="en">${esc(a.name.en)}</tspan></text><rect x="${x}" y="${y}" width="${Math.max(1,w)}" height="22" rx="4" fill="${color}"/><text x="${a.delta<0?x-5:x+w+5}" y="${y+15}" text-anchor="${a.delta<0?'end':'start'}" font-size="12" fill="var(--ink)">${a.delta>0?'+':''}${a.delta.toFixed(1)} pp</text>`});
  const legend=`<div class="legend"><span><i style="background:var(--green)"></i>${L('成本下降，改善利益率','Cost share down; margin improves')}</span><span><i style="background:var(--red)"></i>${L('成本上升，壓低利益率','Cost share up; margin declines')}</span></div>`;

function kpiMargin(){const names=['Gross margin','Operating margin'],colors=['var(--gold)','var(--green)'],vals=names.map(n=>years.map(y=>get(n,y))),W=600,H=300,p={l:50,r:20,t:22,b:42},all=vals.flat().filter(Number.isFinite),max=Math.ceil(Math.max(...all)/10)*10,min=Math.floor(Math.min(...all)/10)*10-10,x=i=>p.l+(W-p.l-p.r)*(years.length===1?.5:i/(years.length-1)),y=v=>p.t+(H-p.t-p.b)*(1-(v-min)/(max-min||1));let g='';for(let i=0;i<=4;i++){const v=min+(max-min)*i/4,yy=y(v);g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${p.l-6}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v.toFixed(0)}%</text>`}vals.forEach((vs,j)=>{g+=`<polyline points="${vs.map((v,i)=>Number.isFinite(v)?`${x(i)},${y(v)}`:'').filter(Boolean).join(' ')}" fill="none" stroke="${colors[j]}" stroke-width="3"/>`;vs.forEach((v,i)=>{if(Number.isFinite(v))g+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${colors[j]}"/><text x="${x(i)}" y="${y(v)-8-j*12}" text-anchor="middle" font-size="11" fill="var(--ink)">${pct(v)}</text>`})});years.forEach((v,i)=>g+=`<text x="${x(i)}" y="${H-14}" text-anchor="middle" font-size="12" fill="var(--muted)">${esc(v)}</text>`);return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gross and operating margin">${g}</svg><div class="legend">${names.map((n,i)=>`<span><i style="background:${colors[i]}"></i>${L(n==='Gross margin'?'毛利率（計算值）':'營業利益率',n)}</span>`).join('')}</div>`}
