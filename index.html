let lang='zh',theme='light',data=null,page='overview',region='all',model='all',status='all',category='all',query='',paused=false,speechSession=0;
try{lang=localStorage.getItem('bna-language')||'zh';theme=localStorage.getItem('bna-theme')||'light'}catch{}if(!['zh','en'].includes(lang))lang='zh';
const t=k=>text[k]?.[lang]??k;const v=o=>o?.[lang]??'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const main=document.querySelector('main');const dialog=document.querySelector('#detail');
function save(k,val){try{localStorage.setItem(k,val)}catch{}}
function stopSpeech(){speechSession++;window.speechSynthesis?.cancel();document.querySelector('#audioBar').hidden=true;paused=false;document.querySelector('#pauseAudio').textContent=t('pause')}
function translateChrome(){document.documentElement.lang=lang==='zh'?'zh-Hant':'en';document.documentElement.dataset.theme=theme;document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));document.querySelector('#language').textContent=lang==='zh'?'EN':'中文';document.querySelector('#theme').textContent=theme==='dark'?'☀':'◐';document.querySelector('#theme').setAttribute('aria-label',lang==='zh'?'切換亮暗主題':'Switch light and dark theme');document.querySelector('#language').setAttribute('aria-label',lang==='zh'?'切換至英文':'Switch to Chinese');document.querySelector('#navigation').innerHTML=navItems.map(([id,icon],i)=>`<a href="#${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${icon}</span>${esc(t(id))}<span class="nav-number">0${i+1}</span></a>`).join('');document.querySelector('#currentLabel').textContent=t(page)}
const notice=()=>`<div class="notice">${esc(t('prototypeNotice'))}</div>`;
const heading=(eyebrow,title,desc)=>`<div class="eyebrow">${eyebrow}</div><h1 class="page-title">${esc(t(title)).replace(/\n/g,'<br>')}</h1><p class="page-desc">${esc(t(desc))}</p>`;
const option=(val,label,selected)=>`<option value="${val}" ${selected===val?'selected':''}>${esc(t(label))}</option>`;
function regionControl(){return `<label>${esc(t('region'))}<select id="regionFilter">${[['all','allRegions'],['global','global'],['north-america','northAmerica'],['china','china']].map(([val,label])=>option(val,label,region)).join('')}</select></label>`}
function overview(){const mods=[['bmc','▦','moduleBmc'],['pestel','◎','modulePestel'],['events','↗','moduleEvents'],['competitors','⇄','moduleCompetition']];return `<section class="hero"><div class="hero-copy"><div class="eyebrow">BEAN THERE. READ THAT. / 01</div><h1>${esc(t('heroTitle')).replace(/\n/g,'<br>')}</h1><p>${esc(t('heroDesc'))}</p><a class="hero-action" href="#bmc">${esc(t('heroButton'))}</a></div><div class="hero-art" aria-hidden="true"><div class="orbit"></div><svg viewBox="0 0 240 250" fill="none"><ellipse cx="120" cy="220" rx="74" ry="12" fill="#08271f"/><path d="M66 72h108l-17 137c-2 14-72 14-74 0Z" fill="#e4e5ce"/><path d="M73 128h94l-7 57H80Z" fill="#27634e"/><path d="M73 128h94" stroke="#346f59"/><rect x="55" y="63" width="130" height="14" rx="5" fill="#d1d7bd"/><path d="M64 62l7-12h98l7 12" fill="#f2f1df"/><circle cx="120" cy="156" r="18" stroke="#b7cdb4"/><path d="M112 156c12-18 24 1 12 12-6 5-17-4-12-12Z" stroke="#b7cdb4"/><path d="M119 145l3 24" stroke="#b7cdb4"/><path d="M101 33c-13-14 13-16 2-29M126 35c-13-14 13-16 2-29" stroke="#b4c9b0" stroke-width="2" stroke-linecap="round" opacity=".45"/></svg><span class="art-caption">COFFEEHOUSE / A BUSINESS LENS</span></div><span class="hero-corner">G1 RESEARCH EDITION</span></section><div class="status-grid">${[['scope','coffeehouse','twoModels'],['cadence','weekly','cadenceNote'],['lastUpdate','notConnected','statusNote'],['dataState','demo','demoNote']].map(([a,b,c])=>`<div class="status-cell"><div class="status-label">${esc(t(a))}</div><div class="status-value">${a==='lastUpdate'?'<i class="dot"></i>':''}${esc(t(b))}</div><div class="status-caption">${esc(t(c))}</div></div>`).join('')}</div><div class="section-head"><h2>${esc(t('fourLenses'))}</h2><span class="meta">${esc(t('frameworkMeta'))}</span></div><section class="modules">${mods.map(([id,icon,desc],i)=>`<button class="module" data-go="${id}"><span class="module-icon" aria-hidden="true">${icon}</span><h3>${esc(t(id))}</h3><p>${esc(t(desc))}</p><span class="module-bottom"><span>0${i+1} / ${esc(t('explore'))}</span><span>↗</span></span></button>`).join('')}</section><div class="bottom-grid"><section><div class="section-head"><h2>${esc(t('recent'))}</h2><a href="#events">${esc(t('viewAll'))}</a></div><div class="panel">${data.events.slice(0,3).map((e,i)=>`<div class="event-mini"><span class="event-num">0${i+1}</span><button data-event="${e.id}"><h3>${esc(v(e.title))}</h3><p>${esc(t(e.region==='north-america'?'northAmerica':e.region))} · ${esc(e.tags[0])}</p></button><span class="badge amber">${esc(t('sample'))}</span></div>`).join('')}</div></section><section><div class="section-head"><h2>${esc(t('videoTitle'))}</h2></div><div class="panel"><button class="video" id="videoSlot" style="width:100%"><span class="play-ring" aria-hidden="true">▷</span><h3>${esc(t('videoPending'))}</h3><p>${esc(t('videoDesc'))}</p></button><div class="video-info"><span>02:00</span><span>${esc(t('videoInfo'))}</span></div></div></section></div>${notice()}`}
function bmc(){return heading('01 / BUSINESS MODEL CANVAS','bmcTitle','bmcDesc')+`<div class="chips">${[['all','allModels'],['direct','direct'],['licensed','licensed']].map(([id,key])=>`<button class="chip ${model===id?'active':''}" data-model="${id}" aria-pressed="${model===id}">${esc(t(key))}</button>`).join('')}</div>${notice()}<div class="bmc-scroll" role="region" tabindex="0" aria-label="Business Model Canvas"><div class="bmc-grid">${data.bmc.map((b,i)=>`<article class="panel bmc-card"><div class="card-index">${['KP','KA','VP','CR','CSeg','KR','CH','CS','RS'][i]} / BMC</div><h3>${esc(v(b.name))}</h3><p style="font-size:12px;color:var(--muted)">${esc(v(b.body))}</p><ul>${model!=='licensed'?`<li><strong>${esc(t('direct'))}</strong>：${esc(v(b.direct))}</li>`:''}${model!=='direct'?`<li><strong>${esc(t('licensed'))}</strong>：${esc(v(b.licensed))}</li>`:''}</ul><div class="card-note">${esc(t('draft'))}</div><button class="card-link" data-bmc="${i}">${esc(t('basis'))} ↗</button></article>`).join('')}</div></div><p class="bmc-scroll-hint">${lang==='zh'?'上方五欄，底部為 CS 成本結構與 RS 收入來源。小螢幕可左右捲動完整畫布。':'Five columns above, Cost Structure (CS) and Revenue Streams (RS) below. Scroll horizontally on smaller screens.'}</p>`}
function pestel(){return heading('02 / EXTERNAL ENVIRONMENT','pestelTitle','pestelDesc')+`<div class="controls">${regionControl()}</div><div class="notice">${esc(t('pestelEmpty'))}</div><div class="pestel-grid">${data.pestel.map((p,i)=>`<article class="panel pestel-card"><div class="letter">${p.letter}</div><h3>${esc(v(p.name))}</h3><p>${esc(v(p.question))}</p><div class="card-note"><span class="eyebrow">${esc(t('watch'))}</span><p>${esc(v(p.watch))}</p></div><span class="badge amber">${esc(t('draft'))}</span><button class="card-link" data-pestel="${i}">${esc(t('basis'))} ↗</button></article>`).join('')}</div>`}
function competitors(){return heading('03 / COMPETITOR ANALYSIS','competitionTitle','competitionDesc')+`<div class="notice">${esc(t('comparisonNotice'))}</div><div class="panel comparison"><table><thead><tr><th>${esc(t('dimension'))}</th><th>Starbucks</th><th>Luckin Coffee / 瑞幸咖啡</th></tr></thead><tbody>${[['price','alignPrice'],['experience','alignExperience'],['footprint','alignFootprint'],['digital','alignDigital']].map(([a,b])=>`<tr><td>${esc(t(a))}</td><td>${esc(t('missing'))}<small>${esc(t(b))}</small></td><td>${esc(t('missing'))}<small>${esc(t(b))}</small></td></tr>`).join('')}</tbody></table></div><div class="data-summary"><div class="panel"><div class="eyebrow">${esc(t('comparability'))}</div><h3>${esc(t('comparableDesc'))}</h3><a href="#sources" class="card-link">${esc(t('sources'))} →</a></div><div class="panel"><div class="eyebrow">${esc(t('researchScope'))}</div><h3>${lang==='zh'?'先確認市場，再比較競爭。':'Define the market before comparing.'}</h3><p style="font-size:12px;color:var(--muted)">${lang==='zh'?'瑞幸是初版確認對象。其他對象必須先提出理由與關係依據，再由團隊確認。':'Luckin is confirmed in the initial scope. Further targets require a rationale, relationship evidence and team approval.'}</p></div></div>`}
function filteredEvents(){const q=query.trim().toLocaleLowerCase();return data.events.filter(e=>(region==='all'||e.region===region)&&(model==='all'||e.model===model||e.model==='both')&&(status==='all'||e.status===status)&&(category==='all'||e.category===category)&&(!q||[v(e.title),v(e.summary)].join(' ').toLocaleLowerCase().includes(q)))}
function eventCards(){const list=filteredEvents();document.querySelector('#resultCount')?.replaceChildren(document.createTextNode(`${list.length} ${t('results')}`));return list.length?list.map(e=>`<article class="panel event-card"><div class="event-card-top"><span class="badge">${esc(t(e.region==='north-america'?'northAmerica':e.region))} · ${esc(t(e.model==='both'?'allModels':e.model))}</span><span class="badge amber">${esc(t(e.status==='pending'?'pending':'sample'))}</span></div><h3>${esc(v(e.title))}</h3><p>${esc(v(e.summary))}</p><div class="chips">${e.tags.map(tag=>`<span class="badge">${esc(tag)}</span>`).join('')}</div><div class="card-footer"><span class="status-caption">${esc(t('sample'))} · ${esc(t('statusNote'))}</span><button class="card-link" data-event="${e.id}">${esc(t('openNote'))}</button></div></article>`).join(''):`<div class="empty">${esc(t('noResults'))}</div>`}
function events(){return heading('04 / EVENTS & IMPACTS','eventsTitle','eventsDesc')+`<div class="controls"><input id="eventSearch" type="search" placeholder="${esc(t('search'))}" aria-label="${esc(t('search'))}" value="${esc(query)}">${regionControl()}<label>${esc(t('allModels'))}<select id="modelFilter">${[['all','allModels'],['direct','direct'],['licensed','licensed']].map(([a,b])=>option(a,b,model)).join('')}</select></label></div><div class="controls"><select id="categoryFilter" aria-label="${esc(t('allCategories'))}">${[['all','allCategories'],['environment','environment'],['operations','operations'],['competition','competition']].map(([a,b])=>option(a,b,category)).join('')}</select><select id="statusFilter" aria-label="${esc(t('allStatus'))}">${[['all','allStatus'],['example','sample'],['pending','pending']].map(([a,b])=>option(a,b,status)).join('')}</select><button class="chip" id="resetFilters">${esc(t('clear'))}</button><span class="meta" id="resultCount" aria-live="polite">${filteredEvents().length} ${esc(t('results'))}</span></div><div class="cards-grid" id="eventCards">${eventCards()}</div>${notice()}`}
function sources(){return heading('05 / EVIDENCE & METHODS','sourcesTitle','sourcesDesc')+`<div class="source-list">${data.sources.map(s=>`<article class="panel source-card"><span class="badge amber">${esc(t('candidate'))}</span><h3>${esc(s.name)}</h3><span class="eyebrow">${esc(v(s.type))}</span><p>${esc(v(s.scope))}</p><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(t('visit'))}</a></article>`).join('')}</div><div class="section-head"><h2>${esc(t('pipelineTitle'))}</h2></div><div class="pipeline">${['step1','step2','step3','step4','step5'].map((key,i)=>`<span><b>0${i+1}</b>${esc(t(key))}</span>`).join('')}</div><div class="data-summary">${[['zeroTitle','zeroDesc'],['reviewTitle','reviewDesc'],['stockTitle','stockDesc'],['statusTitle','statusDesc']].map(([a,b])=>`<article class="panel"><h3>${esc(t(a))}</h3><p>${esc(t(b))}</p></article>`).join('')}</div>`}
function render(){translateChrome();if(!data){main.innerHTML=`<div class="panel"><p>${esc(t('loadError'))}</p><button class="chip" id="reload">${esc(t('retry'))}</button></div>`;return}main.innerHTML=({overview,bmc,pestel,competitors,events,sources}[page]||overview)();}
function showDetail(body){stopSpeech();document.querySelector('#detailBody').innerHTML=body;dialog.showModal()}
function eventDetail(id){const e=data.events.find(x=>x.id===id);if(!e)return;showDetail(`<span class="badge amber">${esc(t(e.status==='pending'?'pending':'sample'))}</span><h2>${esc(v(e.title))}</h2><h3>${esc(t('fact'))}</h3><p>${esc(v(e.fact))}</p>${e.status==='pending'?`<div class="notice">${esc(t('pendingText'))}</div>`:['relation','impact','follow'].map(k=>`<h3>${esc(t(k))}</h3><p>${esc(v(e[k]))}</p>`).join('')}<h3>${esc(t('evidence'))}</h3><p>${esc(t('noEventSources'))}</p>`)}
function toast(msg){const el=document.querySelector('#toast');el.textContent=msg;el.hidden=false;setTimeout(()=>el.hidden=true,6000)}
document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go)location.hash=go.dataset.go;const ev=e.target.closest('[data-event]');if(ev)eventDetail(ev.dataset.event);const b=e.target.closest('[data-bmc]');if(b){const item=data.bmc[Number(b.dataset.bmc)];showDetail(`<h2>${esc(v(item.name))}</h2><p>${esc(t('bmcBasis'))}</p><a href="#sources" id="sourceJump">${esc(t('sources'))} →</a>`)}const p=e.target.closest('[data-pestel]');if(p){const item=data.pestel[Number(p.dataset.pestel)];showDetail(`<h2>${esc(v(item.name))}</h2><p>${esc(t('pestelEmpty'))}</p><p>${esc(v(item.watch))}</p>`)}const m=e.target.closest('[data-model]');if(m){model=m.dataset.model;render()}if(e.target.closest('#videoSlot'))showDetail(`<h2>${esc(t('videoTitle'))}</h2><p>${esc(t('videoDialog'))}</p><span class="badge">${esc(t('videoInfo'))}</span>`);if(e.target.closest('#sourceJump'))dialog.close();if(e.target.closest('#resetFilters')){region=model=status=category='all';query='';render()}if(e.target.closest('#reload'))location.reload()});
document.addEventListener('change',e=>{const map={regionFilter:'region',modelFilter:'model',categoryFilter:'category',statusFilter:'status'};if(map[e.target.id]){stopSpeech();const val=e.target.value;if(e.target.id==='regionFilter')region=val;if(e.target.id==='modelFilter')model=val;if(e.target.id==='categoryFilter')category=val;if(e.target.id==='statusFilter')status=val;render()}if(e.target.id==='audioRate')stopSpeech()});
document.addEventListener('input',e=>{if(e.target.id==='eventSearch'){stopSpeech();query=e.target.value;document.querySelector('#eventCards').innerHTML=eventCards()}});
document.querySelector('#closeDetail').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
document.querySelector('#language').onclick=()=>{stopSpeech();dialog.close();lang=lang==='zh'?'en':'zh';save('bna-language',lang);render()};
document.querySelector('#theme').onclick=()=>{theme=theme==='dark'?'light':'dark';save('bna-theme',theme);translateChrome()};
window.addEventListener('hashchange',()=>{stopSpeech();dialog.close();page=navItems.some(([id])=>id===location.hash.slice(1))?location.hash.slice(1):'overview';render();window.scrollTo({top:0});main.focus({preventScroll:true})});
document.querySelector('#read').onclick=()=>{if(!('speechSynthesis'in window)){toast(t('unsupported'));return}stopSpeech();const token=speechSession;const chunks=[...main.querySelectorAll('h1,h2,h3,p,.hero-copy .eyebrow,.status-label,.status-value,.status-caption,.card-note,li,td')].filter(el=>!el.closest('button')&&el.textContent.trim()).map(el=>el.textContent.trim()).flatMap(s=>s.match(/.{1,180}(?:[。！？.!?]|$)/gu)||[s]);if(!chunks.length)return;document.querySelector('#audioBar').hidden=false;document.querySelector('#audioStatus').textContent=t('reading');let idx=0;function next(){if(token!==speechSession)return;if(idx>=chunks.length){stopSpeech();return}const utterance=new SpeechSynthesisUtterance(chunks[idx++]);utterance.lang=lang==='zh'?'zh-TW':'en-US';utterance.rate=Number(document.querySelector('#audioRate').value);const voice=window.speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith(lang==='zh'?'zh-tw':'en'));if(voice)utterance.voice=voice;utterance.onend=next;utterance.onerror=e=>{if(token===speechSession&&e.error!=='canceled'&&e.error!=='interrupted'){stopSpeech();toast(t('readError'))}};window.speechSynthesis.speak(utterance)}next()};
document.querySelector('#pauseAudio').onclick=()=>{paused=!paused;if(paused)window.speechSynthesis.pause();else window.speechSynthesis.resume();document.querySelector('#pauseAudio').textContent=t(paused?'resume':'pause')};document.querySelector('#stopAudio').onclick=stopSpeech;window.addEventListener('pagehide',stopSpeech);
page=navItems.some(([id])=>id===location.hash.slice(1))?location.hash.slice(1):'overview';translateChrome();
const embeddedData=document.getElementById('embeddedData');
const dataRequest=embeddedData?Promise.resolve().then(()=>JSON.parse(embeddedData.textContent)):(location.protocol==='file:'&&window.BNA_OFFLINE_DATA?Promise.resolve(window.BNA_OFFLINE_DATA):fetch('data.json').then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}));
dataRequest.then(d=>{if(!Array.isArray(d.bmc)||!Array.isArray(d.events)||!Array.isArray(d.pestel)||!Array.isArray(d.sources))throw Error('Invalid data');data=d;render()}).catch(()=>render());
</script></body></html>
